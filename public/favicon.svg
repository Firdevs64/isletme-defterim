  <path d="M130 380 C120 378, 115 370, 115 360 L115 160 C115 170, 120 178, 130 180 Z" fill="#cbd5e1" opacity="0.6"/>

  <!-- Sağ Sayfalar (3 Katmanlı Büyüyen Yeşil Yapraklar) -->
  <!-- Katman 3 (En arka yeşil yaprak) -->
  <path d="M266 390 C290 375, 340 370, 395 350 C380 290, 370 230, 360 170 C310 210, 280 320, 266 390 Z" fill="url(#leafGrad3)"/>
  
  <!-- Katman 2 (Orta yeşil yaprak) -->
  <path d="M266 390 C290 370, 335 340, 370 290 C360 230, 350 175, 335 130 C295 190, 275 310, 266 390 Z" fill="url(#leafGrad2)"/>

  <!-- Katman 1 (En ön ve en parlak yükselen yaprak) -->
  <path d="M266 390 C280 340, 310 240, 325 120 C290 170, 270 270, 266 390 Z" fill="url(#leafGrad1)"/>
  <path d="M266 390 C272 320, 290 220, 325 120 C322 135, 315 200, 266 390 Z" fill="#6ee7b7" opacity="0.4"/>

  <!-- Defter Omurgası ve Alt Işık -->
  <ellipse cx="256" cy="392" rx="10" ry="4" fill="#047857"/>
